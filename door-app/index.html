<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a22" />
    <title>Door Keys</title>
  </head>
  <body>
    <main>
      <header><span class="network"><i></i> Products devnet</span></header>
      <section class="control" aria-labelledby="title">
        <h1 id="title">Who has the key?</h1>
        <p class="intro">Select the enabled keys, then click Apply.</p>
        <div class="key-stage" id="stage" data-state="unknown" aria-hidden="true">
          <svg viewBox="0 0 200 140"><path d="M75 88a31 31 0 1 1 7-45l65 0 17 17-14 14-12-12-11 11-12-12H83a31 31 0 0 1-8 27z"/><circle cx="57" cy="61" r="10"/></svg>
        </div>
        <p class="caption">Currently applied</p>
        <div class="state-row"><span id="state-dot"></span><h2 id="state">Connecting…</h2></div>
        <div class="keys" role="group" aria-label="Authorized keys">
          <button type="button" class="key-choice" data-key="0" aria-label="Alice" aria-pressed="false" disabled><span class="key-avatar" aria-hidden="true">A</span><span class="key-name">Alice<small id="hint-0">Unavailable</small></span></button>
          <button type="button" class="key-choice" data-key="1" aria-label="Bob" aria-pressed="false" disabled><span class="key-avatar" aria-hidden="true">B</span><span class="key-name">Bob<small id="hint-1">Unavailable</small></span></button>
        </div>
        <button id="apply" class="primary" type="button" disabled>Apply</button>
        <p id="status" role="status" aria-live="polite">Connecting to the Polkadot host…</p>
        <button id="retry" class="secondary" hidden>Reconnect</button>
        <section class="wallet" aria-label="Wallet funding">
          <label for="wallet-address">Your funding address</label>
          <p>Send PAS on Paseo Asset Hub to this address to pay for setup and transactions.</p>
          <div class="address-row"><input id="wallet-address" readonly aria-label="Your funding address" placeholder="Connect your wallet to see your address"><button id="copy-address" class="secondary" type="button" disabled>Copy</button></div>
          <p id="wallet-status" role="status" aria-live="polite">Connecting your wallet…</p>
          <button id="connect-wallet" class="secondary" type="button" hidden>Connect wallet</button>
        </section>
      </section>
      <footer><div class="deployment"><span id="app-version"></span><span id="contract-address"></span></div><details><summary>Chain details</summary><p id="details"></p><p id="transaction"></p></details></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
