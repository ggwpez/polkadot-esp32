[platformio]
default_envs = esp32dev

[env]
platform_packages =
    framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    tool-esptoolpy@2.41100.0

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

board_build.partitions = partitions.csv

; The benchmark sources have their own setup()/loop() and belong only to their
; respective environments below.
build_src_filter = +<*> -<bench.cpp> -<edbench.cpp> -<batchbench.cpp> -<mcbench.cpp>

upload_port = rfc2217://host.internal:4000?ign_set_control
; The RFC2217 bridge corrupted packets at 921600 during the devnet bring-up.
upload_speed = 115200
monitor_port = rfc2217://host.internal:4000?ign_set_control
monitor_speed = 115200

; Peripheral libraries and their transitive dependencies are vendored in lib/.

; LC_USE_FAST_ED25519 routes lc_ed25519_verify through the vendored ref10 copy
; instead of the framework's prebuilt libsodium: 1.06x at -Os, no semantic
; change, checked against the prebuilt one on 1,577 device inputs by env:mcbench.
; It costs about 30 KB of flash, and EXPERIMENTS.md E5 found image size moving
; byte-identical code by 4% through instruction-cache layout alone - so if this
; is ever in doubt, drop the flag and compare, do not reason about it.
;
; No -O flag here on purpose: the framework compiles at -Os, which E5/E6 measured
; as the fastest setting for this verifier on this chip. Do not "helpfully" raise
; it - -O3 emits the same 203 multiplies and 47 more spills, and is slower.
; LC_ED25519_PRECOMP compiles in src/checkpoint_precomp.c: the eight odd
; multiples of every authority key, which the verifier would otherwise rebuild
; from the encoded key on each of ~403 signatures per justification. 562 KiB of
; flash (32.9% -> 51.3% of a 3 MB app partition), no RAM, and no change to which
; signatures are accepted - test/run_pre.sh checks the generated tables against
; ref10's own arithmetic and the resulting verdicts against libsodium.
;
; It must be regenerated with the keys. tools/gen_checkpoint.py does both; if
; only the tables need rebuilding, --precomp-only does it from the keys already
; in checkpoint.h and cannot touch the trust root. src/main.cpp #errors if the
; two disagree on set_id.
build_flags =
    -DLC_USE_FAST_ED25519
    -DLC_ED25519_PRECOMP
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/libsodium/src/libsodium/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/port_include
    -L$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/lib
    -Wl,-l:liblibsodium.a

; Core-affinity benchmark - see src/bench.cpp. Swaps main.cpp for bench.cpp and
; drops the display, so nothing but the verification path is being timed.
[env:bench]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp> -<ui.cpp> -<door.cpp> -<edbench.cpp> -<batchbench.cpp> -<mcbench.cpp>
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/libsodium/src/libsodium/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/port_include
    -L$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/lib
    -Wl,-l:liblibsodium.a

; Offline A/B microbenchmark for the framework's prebuilt -Os verifier versus
; the same libsodium ref10 path vendored in lib/ed25519_fast. Ratios in
; EXPERIMENTS.md E5/E6.
[env:edbench_os]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
build_src_filter = +<lc_crypto.c> +<edbench.cpp>
; No -O flag: the framework appends its own -Os after these, and that is the
; setting this comparison concluded on. There used to be an -O3 arm here; it is
; gone because the question is settled and the answer is written down. E5/E6:
; -O3 emits exactly the same multiplies for fe25519_mul as -Os and pays extra
; spills for them, so on this 32 KB-I-cache part the vendored code came out
; slower than the prebuilt one. To reproduce that, add build_unflags = -Os and
; -O3 to a copy of this env - do not reason about it, measure it.
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/libsodium/src/libsodium/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/port_include
    -L$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/lib
    -Wl,-l:liblibsodium.a

; Batch verification against per-signature verification, on the fixed
; signature corpus in test/fixtures/ed_corpus.h. See src/batchbench.cpp.
;
; LC_BATCH_W is compile-time (it sizes the digit array); the chunk size is swept
; at runtime inside a state sized for LC_BATCH_CHUNK, so one flash covers the
; whole time/RAM trade-off.
;
; -O3 here, unlike everywhere else in this file, because the batch verifier is
; a different shape of code from the per-signature one and was measured to want
; it. The framework appends its own -Os after these flags, so raising the level
; needs build_unflags to take that away first.
;
; The -O2/-Os/quick arms this env used to have are gone: the sweep is finished
; and lives in EXPERIMENTS.md. Batch verification is not wired into the firmware
; anyway - it accepts a signature class libsodium rejects, and that has to be
; settled before it can ship - so these arms were preserving a conclusion, not
; serving a workflow. src/batchbench.cpp still honours -DBATCHBENCH_QUICK if you
; want the fast loop back while tuning.
[env:batchbench]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
build_src_filter = +<lc_crypto.c> +<batchbench.cpp>
build_unflags = -Os
build_flags =
    -DLC_BATCH_W=6
    -DLC_BATCH_CHUNK=512
    -DLC_OPT_NAME='"O3"'
    -O3
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/libsodium/src/libsodium/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/port_include
    -L$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/lib
    -Wl,-l:liblibsodium.a

; Per-signature verification on one core and on both, no batching. See
; src/mcbench.cpp. This is the semantics-preserving arm: the accepted and
; rejected sets are libsodium's, so unlike the batch it needs no decision about
; what Substrate accepts before it can ship.
;
; -Os is not unflagged here on purpose. E5/E6: -O3 emits the same 203 multiplies
; for fe25519_mul as -Os and pays 47 extra spills, and on this 32 KB-I-cache part
; that made the vendored verifier SLOWER than the prebuilt one. -Os is the
; measured best setting for both arms, so it is the only one built.
[mcbench_base]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
build_src_filter = +<lc_crypto.c> +<mcbench.cpp> +<checkpoint_precomp.c>
; LC_ED25519_PRECOMP without LC_USE_FAST_ED25519: this environment wants the
; tables but must keep lc_ed25519_verify pointed at the framework's prebuilt
; libsodium, because that is the in-image anchor every ratio is measured
; against. The table arm calls lc_ed25519_verify_pre directly.
build_flags =
    -DLC_OPT_NAME='"Os"'
    -DLC_ED25519_PROFILE
    -DLC_ED25519_PRECOMP
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/libsodium/src/libsodium/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/libsodium/port_include
    -L$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/lib
    -Wl,-l:liblibsodium.a

[env:mcbench]
extends = mcbench_base

; The same benchmark with the handwritten Xtensa fe25519_mul/fe25519_sq. It
; runs a differential test against the C routines before it times anything, and
; refuses to report a number if they disagree.
[env:mcbench_asm]
extends = mcbench_base
build_flags = ${mcbench_base.build_flags} -DLC_FE25519_ASM

; Offline Xtensa regression image: real verifier/policy code, captured proofs.
; No Wi-Fi, physical RFID/OLED drivers, local credentials or live checkpoint.
[env:qemu]
extends = env:esp32dev
build_src_filter = +<lc_crypto.c> +<lc_reader.c> +<scale.c> +<trie.c> +<grandpa.c> +<fmt.c> +<door_policy.c>
build_flags = ${env:esp32dev.build_flags} -UNDEBUG
extra_scripts = pre:tools/qemu_build.py
